components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          writeOnly: true
        expiresIn:
          type: integer
          example: 900
        user:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
            role:
              type: string
              enum:
              - customer
              - driver
              - operator
              - admin
    Coordinate:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    Place:
      type: object
      required:
      - address
      - location
      properties:
        address:
          type: string
          minLength: 5
          maxLength: 255
        location:
          "$ref": "#/components/schemas/Coordinate"
