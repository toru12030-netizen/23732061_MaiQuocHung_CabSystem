openapi: 3.0.3
info:
  title: CAB Auth API
  version: 1.0.0
  description: Authentication and account operations for FR-AUTH-01 through FR-AUTH-06.
paths:
  /auth/register/customer:
    post:
      tags: [Authentication]
      summary: Register a customer
      operationId: registerCustomer
      x-fr-ids: [FR-AUTH-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password]
              properties:
                fullName: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 6, writeOnly: true }
      responses:
        '201': { description: Customer account created }
        '409': { description: Email or phone already exists }
  /auth/register/driver:
    post:
      tags: [Authentication]
      summary: Submit a driver registration
      operationId: registerDriver
      x-fr-ids: [FR-AUTH-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, licenseNumber, licenseClass, verificationToken, vehicle]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 6, writeOnly: true }
                licenseNumber: { type: string }
                licenseClass: { type: string }
                licenseImageUrl: { type: string, format: uri }
                verificationToken: { type: string, writeOnly: true, description: Short-lived proof returned after OTP verification }
                vehicle:
                  type: object
                  required: [plateNumber, brand, model, color, vehicleType, seats]
                  properties:
                    plateNumber: { type: string }
                    brand: { type: string }
                    model: { type: string }
                    color: { type: string }
                    vehicleType: { type: string, enum: [sedan, suv, van] }
                    seats: { type: integer, minimum: 4, maximum: 16 }
      responses:
        '201': { description: Driver application submitted for approval }
        '409': { description: Account or license already exists }
        '422': { description: Verification token is missing, invalid, or expired }
  /auth/driver-otp/request:
    post:
      tags: [Authentication]
      summary: Send a one-time code to a prospective driver's phone
      operationId: requestDriverOtp
      x-fr-ids: [FR-AUTH-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: Verified Vietnamese mobile number }
      responses:
        '202': { description: OTP queued; code is never returned by production API }
        '400': { description: Invalid phone number }
        '429': { description: OTP request rate limit exceeded }
  /auth/driver-otp/verify:
    post:
      tags: [Authentication]
      summary: Verify a one-time code for a prospective driver's phone
      operationId: verifyDriverOtp
      x-fr-ids: [FR-AUTH-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otpCode]
              properties:
                phone: { type: string }
                otpCode: { type: string, minLength: 6, maxLength: 6, writeOnly: true }
      responses:
        '200':
          description: OTP verified; short-lived registration proof returned
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken, expiresIn]
                properties:
                  verificationToken: { type: string, writeOnly: true }
                  expiresIn: { type: integer, example: 300 }
        '400': { description: Invalid or expired OTP }
        '429': { description: Verification attempt limit exceeded }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      x-fr-ids: [FR-AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email or phone number }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: Invalid credentials }
        '403': { description: Account is inactive }
  /auth/profile:
    patch:
      tags: [Authentication]
      summary: Update the current user's profile
      operationId: updateProfile
      x-fr-ids: [FR-AUTH-04]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 2, maxLength: 100 }
                phone: { type: string }
                avatarUrl: { type: string, format: uri, nullable: true }
      responses:
        '200': { description: Profile updated }
        '401': { description: Authentication required }
  /customers/{customerId}:
    get:
      tags: [Authentication]
      summary: Get a customer profile by ID
      operationId: getCustomerById
      x-fr-ids: [FR-AUTH-04]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Customer profile without password or authentication secrets }
        '401': { description: Authentication required }
        '403': { description: Caller is neither the customer nor an authorized operator/admin }
        '404': { description: Customer not found }
  /auth/password:
    put:
      tags: [Authentication]
      summary: Change the current user's password
      operationId: changePassword
      x-fr-ids: [FR-AUTH-05]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true }
                newPassword: { type: string, minLength: 6, writeOnly: true }
      responses:
        '204': { description: Password changed and existing sessions revoked }
        '400': { description: Current password is incorrect }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh-token session
      operationId: logout
      x-fr-ids: [FR-AUTH-06]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { description: Authentication required }
components:
  schemas:
    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, writeOnly: true }
        expiresIn: { type: integer, example: 900 }
        user:
          type: object
          properties:
            id: { type: string }
            fullName: { type: string }
            role: { type: string, enum: [customer, driver, operator, admin] }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
