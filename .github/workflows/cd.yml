name: CAB System - Microservices CD Pipeline

on:
  workflow_run:
    workflows: ["CAB System - Microservices CI Pipeline"]
    types:
      - completed
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Push Microservices Images to Docker Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
            image: cab-api-gateway
          - name: auth-service
            dockerfile: apps/auth-service/Dockerfile
            image: cab-auth-service
          - name: customer-service
            dockerfile: apps/customer-service/Dockerfile
            image: cab-customer-service
          - name: driver-service
            dockerfile: apps/driver-service/Dockerfile
            image: cab-driver-service
          - name: booking-service
            dockerfile: apps/booking-service/Dockerfile
            image: cab-booking-service
          - name: payment-service
            dockerfile: apps/payment-service/Dockerfile
            image: cab-payment-service
          - name: notification-service
            dockerfile: apps/notification-service/Dockerfile
            image: cab-notification-service
          - name: admin-service
            dockerfile: apps/admin-service/Dockerfile
            image: cab-admin-service

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Build Docker Image (Local / Verification)
        run: |
          echo "Building ${{ matrix.service.name }}..."
          docker build \
            -t ${{ matrix.service.image }}:${{ github.sha }} \
            -t ${{ matrix.service.image }}:latest \
            -f ${{ matrix.service.dockerfile }} .

      - name: 5. Tag and Push to Docker Hub (When Secrets Configured)
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO_IMAGE="${DOCKER_USER}/${{ matrix.service.image }}"

          docker tag ${{ matrix.service.image }}:${{ github.sha }} ${REPO_IMAGE}:${{ github.sha }}
          docker tag ${{ matrix.service.image }}:latest ${REPO_IMAGE}:latest

          echo "Pushing ${REPO_IMAGE}:${{ github.sha }} and latest to Docker Hub..."
          docker push ${REPO_IMAGE}:${{ github.sha }}
          docker push ${REPO_IMAGE}:latest
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
