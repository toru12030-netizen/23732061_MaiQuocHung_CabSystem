openapi: 3.0.3

info:
  title: CAB System API
  version: 1.0.0
  description: API specification generated from the corresponding Functional Requirements (FR) in the CAB System SRS.

servers:
  - url: /api/v1

tags:
  - name: Booking Management

paths:
  /bookings:
    post:
      tags:
        - Booking Management
      summary: Create a booking request
      operationId: createBooking
      x-functional-requirements:
        - FR-BK-01
        - FR-BK-02
        - FR-BK-03
        - FR-BK-04

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup
                - destination
                - vehicleType
              properties:
                pickup:
                  type: object
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                    latitude:
                      type: number
                      format: double
                    longitude:
                      type: number
                      format: double

                destination:
                  type: object
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                    latitude:
                      type: number
                      format: double
                    longitude:
                      type: number
                      format: double

                vehicleType:
                  type: string

      responses:
        '201':
          description: Booking request created successfully
        '400':
          description: Missing or invalid booking information
        '401':
          description: Unauthorized

  /bookings/{bookingId}:
    get:
      tags:
        - Booking Management
      summary: Get booking request and current status
      operationId: getBooking
      x-functional-requirement: FR-BK-05

      security:
        - bearerAuth: []

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Booking information returned successfully
        '401':
          description: Unauthorized
        '404':
          description: Booking not found

  /bookings/{bookingId}/status:
    get:
      tags:
        - Booking Management
      summary: Get booking request status
      operationId: getBookingStatus
      x-functional-requirement: FR-BK-05

      security:
        - bearerAuth: []

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Booking status returned successfully
        '401':
          description: Unauthorized
        '404':
          description: Booking not found

  /bookings/{bookingId}/cancel:
    patch:
      tags:
        - Booking Management
      summary: Cancel a booking request
      operationId: cancelBooking
      x-functional-requirement: FR-BK-06

      security:
        - bearerAuth: []

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: Reason for cancelling the booking
                  example: Customer changed travel plan

      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId:
                    type: string
                  status:
                    type: string
                    enum:
                      - CANCELLED
                  cancelledAt:
                    type: string
                    format: date-time

        '400':
          description: Invalid cancellation request

        '401':
          description: Unauthorized

        '403':
          description: User is not allowed to cancel this booking

        '404':
          description: Booking not found

        '409':
          description: Booking cannot be cancelled because it is already completed or cancelled

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT